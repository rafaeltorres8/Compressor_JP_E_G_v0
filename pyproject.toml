[project]
name = "compresor-imagenes-jpeg"
version = "2.0.0"
description = "Aplicación de escritorio (Tkinter) para comprimir y redimensionar imágenes JPEG en lote."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=12.1,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
# 120 en vez de 88/100 por defecto: el código de layout de Tkinter
# (widgets con varias opciones con nombre en una sola llamada) supera
# fácilmente límites más cortos sin ganar legibilidad al partirlo.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
